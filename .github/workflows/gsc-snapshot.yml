# Monthly Search Console snapshot — runs scripts/seo/gsc_snapshot.py on the
# runner and uploads the two artifacts it produces.
#
# Why: the authority-claim loop (spec Part A) needs the monthly snapshot to
# run on a schedule, so a traffic collapse is visible in CI without anyone
# remembering to look.
#
# Auth: the Google service-account key lives in the repository secret
# GSC_SA_KEY. The tool reads a FILE PATH from $GSC_SA_KEY, so the key is
# written to a runner temp file (mode 600) and that path is exported as
# GSC_SA_KEY. The key is never echoed, never printed, never committed, and
# the temp file is deleted at the end of the job.
#
# Exit-code mapping (scripts/seo/gsc_snapshot.py):
#   0 -> healthy run             -> step passes
#   1 -> regression gate tripped -> step FAILS (clicks/impressions -20%)
#   2 -> usage error             -> step FAILS
#   3 -> nothing compared        -> WARNING only, step passes
#        (the service account is not a member of the property, or the
#        window/property does not match: a credential hiccup must never look
#        like a traffic collapse)
#
# Artifacts (retention 30 days): the snapshot JSON and the gitignored legacy
# queue CSV — the artifact is how the queue leaves the runner. The snapshot's
# path is NOT guessed from the date: the run step globs docs/seo for the
# baseline-gsc-*.json the tool actually wrote in this run.
#
# The tool is Python 3 stdlib only (openssl for the JWT signature), so
# ubuntu-latest needs no pip install.
name: GSC snapshot

on:
  schedule:
    - cron: "17 5 1 * *"
  workflow_dispatch:
    inputs:
      site:
        description: "Search Console property to snapshot"
        default: "sc-domain:extramovies.org"
        required: false
        type: string
      against:
        description: "Optional committed baseline to diff against (empty = capture only)"
        default: ""
        required: false
        type: string

concurrency:
  group: gsc-snapshot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    name: Monthly GSC snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Write the service-account key to a runner temp file
        id: key
        env:
          GSC_SA_KEY_SECRET: ${{ secrets.GSC_SA_KEY }}
          SITE_INPUT: ${{ inputs.site || 'sc-domain:extramovies.org' }}
          AGAINST_INPUT: ${{ inputs.against || '' }}
        run: |
          set -euo pipefail

          # The property must be a plain GSC property string. Anything with
          # whitespace or shell metacharacters is rejected BEFORE it reaches
          # GITHUB_ENV or the tool's command line. The whole string is
          # matched (bash regex, not a per-line grep): a value carrying a
          # newline would inject an extra environment line.
          site="$SITE_INPUT"
          if [[ ! "$site" =~ ^[A-Za-z0-9.:/_-]+$ ]]; then
            echo "::error::invalid site property (allowed: letters, digits, dot, colon, dash, underscore, slash)"
            exit 1
          fi

          # Artifact names may not contain ':' or '/', so the name is built
          # from a slug of the property.
          slug=$(printf '%s' "$site" | sed -E 's/[^A-Za-z0-9._-]+/-/g')
          echo "property: $site"
          echo "artifact slug: $slug"

          if [ -z "${GSC_SA_KEY_SECRET:-}" ]; then
            echo "::error::repository secret GSC_SA_KEY is empty — add it under Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          key_path="$RUNNER_TEMP/gsc-sa-key.json"
          umask 077
          printf '%s' "$GSC_SA_KEY_SECRET" > "$key_path"
          chmod 600 "$key_path"
          # Only the byte count is printed; the key itself never is.
          echo "key file: $key_path ($(wc -c < "$key_path") bytes)"

          # The tool reads a PATH from $GSC_SA_KEY.
          echo "GSC_SA_KEY=$key_path" >> "$GITHUB_ENV"
          echo "SITE=$site" >> "$GITHUB_ENV"
          if [ -n "$AGAINST_INPUT" ]; then
            # The baseline path lands in $GITHUB_ENV, so it is validated
            # against a strict allowlist first: a newline here would inject
            # an extra environment line. The whole string is matched (bash
            # regex, not a per-line grep), so a multi-line value cannot
            # slip through one allowed line at a time.
            if [[ ! "$AGAINST_INPUT" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              echo "::error::invalid --against baseline (allowed: letters, digits, dot, dash, underscore, slash)"
              exit 1
            fi
            echo "AGAINST=$AGAINST_INPUT" >> "$GITHUB_ENV"
            echo "baseline to diff against: $AGAINST_INPUT"
          fi

          # The tool writes the snapshot to docs/seo/baseline-gsc-<date>.json.
          # WHICH file that is is decided by the run step (it globs the output
          # directory for the file the tool actually wrote), never by a date
          # computed here.
          echo "key_ready=true" >> "$GITHUB_OUTPUT"
          echo "site_slug=$slug" >> "$GITHUB_OUTPUT"
          echo "queue_path=data/legacy/gsc_inspect_queue.csv" >> "$GITHUB_OUTPUT"

      - name: Run gsc_snapshot.py
        id: run
        if: steps.key.outputs.key_ready == 'true'
        run: |
          set -euo pipefail
          command -v python3 >/dev/null || { echo "::error::python3 missing on the runner"; exit 1; }
          command -v openssl >/dev/null || { echo "::error::openssl missing on the runner (JWT signing fallback)"; exit 1; }
          python3 --version

          args=(--site "$SITE" --days 28 --inspect-top 10)
          if [ -n "${AGAINST:-}" ]; then
            args+=(--against "$AGAINST")
          fi

          rc=0
          # Marker: every file in the output directory that is NEWER than this
          # was written by the tool in THIS run. The upload path is then
          # derived from that file, so a job that crosses UTC midnight targets
          # the file the tool really wrote, not a date guessed beforehand.
          marker="$RUNNER_TEMP/gsc_run_marker"
          touch "$marker"
          sleep 1
          python3 scripts/seo/gsc_snapshot.py "${args[@]}" || rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

          snapshot=""
          while IFS= read -r candidate; do
            [ -n "$candidate" ] || continue
            if [ -z "$snapshot" ] || [ "$candidate" -nt "$snapshot" ]; then
              snapshot="$candidate"
            fi
          done <<< "$(find docs/seo -maxdepth 1 -type f -name 'baseline-gsc-*.json' -newer "$marker" 2>/dev/null || true)"
          if [ -n "$snapshot" ]; then
            echo "snapshot file written by this run: $snapshot"
            # Copied out under its own name: the upload step then globs the
            # runner temp dir, so the artifact path never depends on a step
            # output (the run step may have failed on the regression gate).
            cp "$snapshot" "$RUNNER_TEMP/$(basename "$snapshot")"
            echo "snapshot_path=$snapshot" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::gsc_snapshot: no baseline-gsc-*.json was written — there is nothing to upload"
          fi

          case "$rc" in
            0)
              echo "gsc_snapshot: healthy run — snapshot captured"
              ;;
            1)
              echo "::error::gsc_snapshot: REGRESSION gate tripped (clicks or impressions down more than 20%) — the snapshot artifact carries the numbers"
              exit 1
              ;;
            2)
              echo "::error::gsc_snapshot: usage error (exit 2) — the command line, the key file or the --against baseline is wrong"
              exit 1
              ;;
            3)
              echo "::warning::gsc_snapshot: nothing compared (exit 3) — the service account is probably not a member of the property, or the window/property does not match. This is NOT a traffic collapse; no snapshot was written."
              ;;
            *)
              echo "::error::gsc_snapshot: unexpected exit code $rc"
              exit 1
              ;;
          esac

      - name: Upload the GSC snapshot
        if: always() && steps.key.outputs.key_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gsc-snapshot-${{ steps.key.outputs.site_slug }}
          path: ${{ runner.temp }}/baseline-gsc-*.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload the legacy inspect queue
        if: always() && steps.key.outputs.key_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gsc-legacy-queue-${{ steps.key.outputs.site_slug }}
          path: ${{ steps.key.outputs.queue_path }}
          retention-days: 30
          if-no-files-found: warn

      - name: Delete the service-account key file
        if: always()
        run: |
          rm -f "${RUNNER_TEMP:-/tmp}/gsc-sa-key.json"
          echo "key file removed"
