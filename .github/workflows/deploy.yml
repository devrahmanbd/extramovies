# Auto-deploy to CyberPanel VPS. Release channels (owner decision 2026-10-18):
#   push prod-extra   → extramovies.org ONLY
#   push prod         → cinemavilla.in ONLY ("vanilla" sync)
#   workflow_dispatch → both sites (escape hatch)
# main = development (never deploys). Release flow: merge main -> prod-extra
# (extramovies) or -> prod (cinemavilla), then push. Recommended: protect
# both release branches in repo Settings → Branches.
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST, SSH_USER, SSH_PORT, SSH_KEY (private deploy key; server holds the public half)
#
# Content release: seed .md files under seeds/<site>/ deploy automatically
# with the release (review imports run on every deploy). No separate action
# needed — deploy logs show SEED OK lines per slug.
# Server assumptions (validated 2026-10-07 — keep this list current):
#   - node/npm via nvm at $HOME/.nvm (non-interactive SSH skips .bashrc)
#   - sqlite3 CLI present; PM2 installed globally
#   - env lives in each site's ecosystem.config.js OUTSIDE the repo
#   - file ownership: captured before root-run steps, restored after
name: Deploy to production

on:
  push:
    branches: [prod, prod-extra]
    # Docs/strategy-only pushes must not recycle production apps, but content
    # seeds MUST: seed .md files live under seeds/<site>/*.md, so markdown is
    # ignored only at the repo ROOT (*.md) and in doc/agent dirs — NOT globally.
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".rules"
      - ".superpowers/**"
      - ".opencode/**"
  workflow_dispatch:

# Shared deploy body (duplicated in both jobs). Per-site values plus
# GITHUB_SHA/GITHUB_EVENT_NAME are expanded LOCALLY into the ssh command
# and delivered to remote bash as positional args ($1..$9). Default and
# job envs exist only in the local runner shell — they never cross SSH.
jobs:
  deploy-extramovies:
    name: Deploy extramovies (prod-extra)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref_name == 'prod-extra'
    concurrency:
      group: deploy-extramovies
      cancel-in-progress: false
    env:
      SEED_SITE: extramovies
      DEPLOY_BRANCH: prod-extra
      APP_DIR: /home/extramovies.org/public_html
      APP_PORT: "3100"
      PM2_NAME: extramovies
      DB_FILE: /home/extramovies.org/private/prod.sqlite
      ECO_FILE: /home/extramovies.org/ecosystem.config.js
      # Public site origin of THIS brand. The seed import announces freshly
      # published reviews to IndexNow, which needs absolute URLs on the
      # site's own host (the key file lives at <SITE_URL>/<key>.txt).
      SITE_URL: https://extramovies.org
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
    steps:
      - name: Deploy over SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "bash -s $APP_DIR $APP_PORT $PM2_NAME $DB_FILE $ECO_FILE $DEPLOY_BRANCH $SEED_SITE $GITHUB_SHA $GITHUB_EVENT_NAME $SITE_URL" <<'EOF'
          set -euo pipefail
          # Site values + GITHUB_SHA/GITHUB_EVENT_NAME arrive as positional
          # args: job/default envs never cross SSH into the remote bash.
          APP_DIR="$1" APP_PORT="$2" PM2_NAME="$3"
          export DB_FILE="$4" ECO_FILE="$5" DEPLOY_BRANCH="$6" SEED_SITE="$7"
          DEPLOY_SHA="$8" EVENT_NAME="$9"
          # Public origin of this brand (used by the IndexNow announcement
          # in the seed import). Not exported: only the import step needs it.
          SITE_URL="${10:-}"

          # 1. Toolchain: CI SSH is non-interactive so nvm never loads via .bashrc
          export NVM_DIR="$HOME/.nvm"
          # shellcheck disable=SC1091
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          for cmd in npm node sqlite3 pm2 curl git; do
            command -v "$cmd" >/dev/null || { echo "FATAL: $cmd not on PATH"; exit 1; }
          done
          node --version
          OWNER=$(stat -c '%U:%G' "$APP_DIR")

          # 2. Code: pin the deploy branch explicitly (extramovies=prod-extra,
          # cinemavilla=prod). A past incident had this box sitting on a stale
          # branch while CI green-deployed it for weeks — checkout + assert HEAD.
          cd "$APP_DIR"
          git config --global --add safe.directory "$APP_DIR"
          git fetch origin
          git checkout "$DEPLOY_BRANCH"
          git pull --ff-only
          deploy_sha="$DEPLOY_SHA"
          # workflow_dispatch from a non-release ref: a strict SHA check
          # would compare against the dispatch ref's head; assert branch HEAD.
          if [ "$EVENT_NAME" != "push" ]; then deploy_sha=$(git rev-parse HEAD); fi
          test "$(git rev-parse HEAD)" = "$deploy_sha" || { echo "FATAL: HEAD $(git rev-parse HEAD) != deploy SHA $deploy_sha"; exit 1; }
          test -f package.json || { echo "FATAL: not a repo checkout"; exit 1; }

          # 3. Build
          npm ci
          npm run build
          test -f dist/server/entry.mjs || { echo "FATAL: build produced no entry"; exit 1; }

          # 4. Data (all idempotent: tracked migrations, seed skips existing)
          mkdir -p "$(dirname "$DB_FILE")"
          npx tsx scripts/migrate-sql.ts
          npm run seed:reviews

          # 4b. Content seeds ship WITH the release: new files under
          # seeds/$SEED_SITE/ import automatically on every deploy.
          # --skip-existing = idempotent, never overwrites rows the owner has
          # published/edited from /admin. --refresh (draft rows only) lets a
          # seed file's published_at/content edits reach rows it previously
          # imported as drafts, so a release CAN publish itself. SITE_ID
          # stamps imports site-exclusive (explicit `sites` in the seed file
          # wins). A seed that declares `managed_fields` may refresh ONLY
          # those SEO fields on its own published row (AGENTS.md §2) — the
          # SEED OK line below then names them. Logs prove what landed.
          if [ -d "seeds/$SEED_SITE" ]; then
            SITE_ID="$SEED_SITE" SITE_URL="$SITE_URL" npm run import -- "seeds/$SEED_SITE" --skip-existing --refresh
            node -e '
              const fs = require("fs");
              const dir = "seeds/" + process.env.SEED_SITE;
              const site = process.env.SEED_SITE;
              const store = JSON.parse(fs.readFileSync("data/reviews.json", "utf8"));
              // Repo-managed seed fields the import refreshed this run
              // (managed_fields in the seed frontmatter — AGENTS.md §2).
              // Shown on the SEED OK line so the log proves what a deploy
              // changed on an already published row.
              let refreshed = {};
              try {
                const report = JSON.parse(fs.readFileSync("data/seed-refresh.json", "utf8"));
                if (report && report.site === site) refreshed = report.refreshed || {};
              } catch (e) { /* no report = nothing was refreshed */ }
              const slugs = fs.readdirSync(dir).filter((f) => f.endsWith(".md")).map((f) => f.slice(0, -3));
              let bad = 0;
              let warned = 0;
              for (const s of slugs) {
                const fm = fs.readFileSync(dir + "/" + s + ".md", "utf8");
                const wantsPublish = /^published_at:[ \t]*\S/m.test(fm);
                // A seed that asks to publish WITHOUT a rating is NOT a deploy
                // failure: the import refuses to publish it and leaves it as a
                // draft on purpose (the owner scores it later, then publishes).
                // Report it, never fail the release on it.
                const rm = fm.match(/^rating:[ \t]*"?(-?\d+(?:\.\d+)?)"?/m);
                const rating = rm ? Number(rm[1]) : NaN;
                const unrated = !Number.isFinite(rating) || rating <= 0 || rating > 10;
                const row = store.find((r) => r.slug === s);
                const tagged = row && Array.isArray(row.sites) && row.sites.includes(site);
                if (tagged && (!wantsPublish || row.status === "published")) {
                  const rf = Array.isArray(refreshed[s]) ? refreshed[s] : [];
                  console.log("SEED OK   " + s + (wantsPublish ? " (status=" + row.status + ")" : "") + (rf.length ? ", seo refreshed: " + rf.join(", ") : ""));
                } else if (tagged && wantsPublish && unrated && row.status === "draft") {
                  console.log("SEED WARN " + s + " (asked to publish without a rating: left as a draft; set a rating, then publish)");
                  warned++;
                } else {
                  console.log("SEED FAIL " + s + (row ? " (status=" + row.status + ")" : " (missing)"));
                  bad++;
                }
              }
              if (warned > 0) console.log("SEED WARN " + warned + " seed(s) need a rating before they can publish (left as drafts)");
              if (bad > 0) process.exit(1);
            '
          else
            echo "SEED none for $SEED_SITE"
          fi

          # 5. Restart deterministically (delete+start: restart reuses stale env)
          pm2 delete "$PM2_NAME" 2>/dev/null || true
          pm2 start "$ECO_FILE"
          pm2 save

          # 6. Health check with retries (cold boots are slow on small VPS)
          ok=""
          for _ in 1 2 3 4 5 6; do
            if curl -fsS -o /dev/null "http://127.0.0.1:${APP_PORT}/"; then ok=1; break; fi
            sleep 5
          done
          test -n "$ok" || { echo "FATAL: app never answered on ${APP_PORT}"; pm2 logs "$PM2_NAME" --lines 20 --nostream; exit 1; }

          # 6b. Canonical-host redirect at the web-server edge (owner
          # decision 2026-10-25): http:// and any non-apex host must 301
          # to the apex https origin, independent of panel settings.
          # CI-managed on purpose: the file is NOT tracked in git (a
          # tracked .htaccess would collide with a panel-written one and
          # abort `git pull`), the block is PREPENDED so it runs before
          # any proxy/deny rules a panel editor left in the file, and
          # existing content is preserved. htaccess-canary is the
          # verification probe — curl -sI https://<domain>/htaccess-canary
          # answers 301 = OLS is reading this file, app 404 = it is not.
          APEX_HOST="${SITE_URL#https://}"
          HT="$APP_DIR/.htaccess"
          if [ -z "$APEX_HOST" ]; then
            echo "HTACCESS WARN: SITE_URL empty - canonical redirect not installed"
          elif [ -f "$HT" ] && grep -q "BEGIN canonical-host-redirect" "$HT"; then
            echo "HTACCESS canonical redirect already present ($APEX_HOST)"
          else
            TMP=$(mktemp)
            {
              printf '%s\n' '# BEGIN canonical-host-redirect (CI-managed by deploy.yml; do not edit)'
              printf '%s\n' 'RewriteEngine On'
              printf '%s\n' 'RewriteCond %{HTTP_HOST} !^'"$APEX_HOST"'$ [NC]'
              printf '%s\n' 'RewriteRule ^ https://'"$APEX_HOST"'%{REQUEST_URI} [R=301,L]'
              printf '%s\n' 'RewriteCond %{HTTPS} !=on'
              printf '%s\n' 'RewriteRule ^ https://'"$APEX_HOST"'%{REQUEST_URI} [R=301,L]'
              printf '%s\n' 'RewriteRule ^htaccess-canary$ https://'"$APEX_HOST"'/ [R=301,L]'
              printf '%s\n' '# END canonical-host-redirect'
              if [ -f "$HT" ]; then cat "$HT"; fi
            } > "$TMP"
            cat "$TMP" > "$HT"
            rm -f "$TMP"
            systemctl restart lsws || lswsctrl restart || echo "HTACCESS WARN: could not restart lsws - redirect inactive until a manual restart"
            echo "HTACCESS canonical redirect installed ($APEX_HOST)"
          fi

          # 7. Hand files back to the site user (root-run steps leave
          # root-owned paths that break panel-side ops)
          chown -R "$OWNER" "$APP_DIR"
          echo "DEPLOY OK ($PM2_NAME)"
          EOF
          rm -f ~/.ssh/deploy_key

