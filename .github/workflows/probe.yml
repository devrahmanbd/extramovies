# Read-only server audit for the streaming-player deployment planning.
# No writes, no restarts, no installs — output only. Safe to delete.
name: Server probe (read-only)

on:
  workflow_dispatch:

concurrency:
  group: probe
  cancel-in-progress: true

env:
  SSH_HOST: ${{ secrets.SSH_HOST }}
  SSH_USER: ${{ secrets.SSH_USER }}
  SSH_PORT: ${{ secrets.SSH_PORT }}
  SSH_KEY: ${{ secrets.SSH_KEY }}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe (read-only)
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/probe_key
          chmod 600 ~/.ssh/probe_key
          ssh -i ~/.ssh/probe_key -o StrictHostKeyChecking=accept-new \
            -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -u
          export NVM_DIR="$HOME/.nvm"
          # shellcheck disable=SC1091
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          echo "== id =="; id; hostname; uname -a
          echo "== resources =="; free -m | head -2; df -h / | tail -1
          echo "== toolchain =="; node --version 2>&1; npm --version 2>&1; git --version
          echo "== media =="; ffmpeg -version 2>/dev/null | head -1 || echo "ffmpeg MISSING"
          command -v ffprobe >/dev/null && echo "ffprobe ok" || echo "ffprobe MISSING"
          echo "== ports =="; ss -tlnp 2>/dev/null | grep -E ':(22|80|443|3001|8080|11470|3100|3200|8090)\b' || echo "none of interest"
          echo "== pm2 =="; pm2 ls 2>&1 | head -12
          echo "== ols =="; ls /usr/local/lsws/conf/vhosts 2>/dev/null || echo "no OLS dir"
          systemctl is-active lsws 2>&1
          echo "== public clone check =="; timeout 25 git ls-remote https://github.com/devrahmanbd/cine-player.git HEAD 2>&1 | head -1
          timeout 25 git ls-remote https://github.com/devrahmanbd/cine-server.git HEAD 2>&1 | head -1
          echo "PROBE DONE"
          REMOTE
          rm -f ~/.ssh/probe_key
