# Seed reviews/content to a production site on demand (no code deploy).
# Content moves as Markdown seed files (seeds/<site>/*.md) committed on main,
# released via prod, then imported into the target site's own store with
# SITE_ID stamping. Additive-only: --skip-existing never touches present rows,
# never deletes. Owner publishes from that site's /admin afterwards.
name: Seed site content

on:
  workflow_dispatch:
    inputs:
      site:
        description: "Target site (or all)"
        required: true
        default: extramovies
        type: choice
        options: [extramovies, cinemavilla, all]
      dir:
        description: "Seed dir override (default: seeds/<site>)"
        required: false
        default: ""
        type: string

jobs:
  seed:
    name: Seed ${{ matrix.site }}
    runs-on: ubuntu-latest
    if: ${{ inputs.site == 'all' || inputs.site == matrix.site }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: extramovies
            app_dir: /home/extramovies.org/public_html
          - site: cinemavilla
            app_dir: /home/cinemavilla.in/public_html
    steps:
      - name: Import seeds over SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'bash -s' <<'EOF'
          set -euo pipefail
          APP_DIR=${{ matrix.app_dir }}
          SITE=${{ matrix.site }}
          SEED_DIR="${{ inputs.dir }}"
          if [ -z "$SEED_DIR" ]; then SEED_DIR="seeds/${SITE}"; fi

          export NVM_DIR="$HOME/.nvm"
          # shellcheck disable=SC1091
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          for cmd in npm node git; do
            command -v "$cmd" >/dev/null || { echo "FATAL: $cmd not on PATH"; exit 1; }
          done
          OWNER=$(stat -c '%U:%G' "$APP_DIR")

          # Content rides the release branch: servers track prod.
          cd "$APP_DIR"
          git config --global --add safe.directory "$APP_DIR"
          git fetch origin
          git checkout prod
          git pull --ff-only
          test -d "$SEED_DIR" || { echo "FATAL: no $SEED_DIR on prod"; exit 1; }

          # SITE_ID stamps imports site-exclusive (explicit `sites` in files wins).
          export SITE_ID="$SITE"
          npm run import -- "$SEED_DIR" --skip-existing

          # Verify back: every seed slug present as a draft in this site's store.
          node -e "
            const fs = require('fs');
            const path = require('path');
            const store = JSON.parse(fs.readFileSync(path.join('data', 'reviews.json'), 'utf8'));
            const slugs = fs.readdirSync('$SEED_DIR').filter((f) => f.endsWith('.md')).map((f) => f.slice(0, -3));
            let bad = 0;
            for (const s of slugs) {
              const row = store.find((r) => r.slug === s);
              const ok = row && row.status === 'draft' && Array.isArray(row.sites) && row.sites.includes('$SITE');
              console.log((ok ? 'SEED OK  ' : 'SEED FAIL ') + s);
              if (!ok) bad++;
            }
            if (bad > 0) process.exit(1);
          "

          chown -R "$OWNER" "$APP_DIR"
          echo "SEED OK ($SITE)"
          EOF
          rm -f ~/.ssh/deploy_key
